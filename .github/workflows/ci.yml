name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build Angular application
        run: npm run build

      # Angular can inline critical CSS and defer the full stylesheet with
      # `media="print" onload="this.media='all'"`. Tauri's CSP (script-src
      # 'self') blocks that inline handler, which leaves the packaged app
      # completely unstyled. Keep the protection so it never ships again.
      - name: Guard against a deferred stylesheet
        run: |
          set -euo pipefail
          html=dist/dexorium/browser/index.html
          if grep -q 'media="print"' "$html"; then
            echo "::error file=angular.json::The production build defers its stylesheet (media=print + inline onload), which Tauri's CSP blocks. Keep optimization.styles.inlineCritical disabled."
            exit 1
          fi
          grep -q '<link rel="stylesheet" href="styles-' "$html"
          echo "Stylesheet is loaded eagerly."

  rust:
    name: Rust core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -p pdx-domain -p pdx-app -p pdx-infra -p pdx-dataset --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml -p pdx-domain -p pdx-app -p pdx-infra -p pdx-dataset

      - name: Verify dataset lockfile
        run: cargo run --manifest-path src-tauri/Cargo.toml -p pdx-dataset -- lock --check-licenses

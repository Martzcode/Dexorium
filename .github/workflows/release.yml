name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Compute release version
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.compute.outputs.skip }}
      version: ${{ steps.compute.outputs.version }}
      semver: ${{ steps.compute.outputs.semver }}
      msi_version: ${{ steps.compute.outputs.msi_version }}
      tag: ${{ steps.compute.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Compute YYYY.MM.XX
        id: compute
        run: |
          set -euo pipefail

          existing="$(git tag --points-at HEAD | grep -E '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$' || true)"
          if [ -n "$existing" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Commit already released as $existing; nothing to do."
            exit 0
          fi

          month="$(date -u +%Y.%m)"
          latest="$(git tag -l "v${month}.[0-9][0-9]" | sed -E 's/^v[0-9]{4}\.[0-9]{2}\.//' | sort -n | tail -n 1 || true)"
          if [ -z "$latest" ]; then
            sequence=1
          else
            sequence=$((10#$latest + 1))
          fi

          if [ "$sequence" -gt 99 ]; then
            echo "::error::Release sequence for ${month} exceeded 99."
            exit 1
          fi

          version="$(printf '%s.%02d' "$month" "$sequence")"
          semver="${month}.${sequence}"
          year="${month:0:4}"
          month_number="${month:5:2}"
          msi_version="$(printf '%02d.%d.%d' "$((10#$year - 2000))" "$((10#$month_number))" "$sequence")"

          {
            echo "skip=false"
            echo "version=$version"
            echo "semver=$semver"
            echo "msi_version=$msi_version"
            echo "tag=v$version"
          } >> "$GITHUB_OUTPUT"

          echo "Releasing $version (semver $semver, MSI $msi_version)"

  dataset:
    name: Rebuild and validate dataset
    needs: version
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pdx-dataset
          key: pdx-dataset-${{ hashFiles('tools/dataset/sources.lock.toml') }}
          restore-keys: |
            pdx-dataset-

      - name: Build, validate and install reference.db
        run: |
          cargo run --release --manifest-path src-tauri/Cargo.toml -p pdx-dataset -- \
            release \
            --version "${{ needs.version.outputs.semver }}" \
            --out dist/dataset \
            --install-resource

      - name: Upload reference database
        uses: actions/upload-artifact@v4
        with:
          name: reference-db
          path: src-tauri/resources/reference.db
          if-no-files-found: error
          retention-days: 7

      - name: Upload dataset reports
        uses: actions/upload-artifact@v4
        with:
          name: dataset-artifacts
          path: |
            dist/dataset/*.md
            dist/dataset/*.json
            dist/dataset/*.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows installers
    needs: [version, dataset]
    if: needs.version.outputs.skip == 'false'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/download-artifact@v4
        with:
          name: reference-db
          path: src-tauri/resources

      - run: npm ci

      - name: Build app and NSIS installer
        shell: pwsh
        run: |
          $config = Join-Path $env:RUNNER_TEMP 'tauri-release.json'
          @{ version = '${{ needs.version.outputs.semver }}' } |
            ConvertTo-Json |
            Set-Content -LiteralPath $config -Encoding utf8
          npx tauri build --bundles nsis --config $config

      - name: Build MSI with an MSI-compatible version
        shell: pwsh
        run: |
          # Windows Installer limits the first two version fields to 255, so the
          # YYYY.MM.XX release version is mapped to YY.MM.XX for the MSI.
          $config = Join-Path $env:RUNNER_TEMP 'tauri-msi.json'
          @{ version = '${{ needs.version.outputs.msi_version }}' } |
            ConvertTo-Json |
            Set-Content -LiteralPath $config -Encoding utf8
          npx tauri bundle --bundles msi --config $config

      - name: Build MSIX for Microsoft Store
        shell: pwsh
        run: |
          ./scripts/build-msix.ps1 `
            -Semver '${{ needs.version.outputs.semver }}' `
            -ReleaseVersion '${{ needs.version.outputs.version }}'

      - name: Align Windows artifact names with the release version
        shell: pwsh
        run: |
          $release = '${{ needs.version.outputs.version }}'
          Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.exe' |
            ForEach-Object { Rename-Item -LiteralPath $_.FullName -NewName "Dexorium_${release}_x64-setup.exe" }
          Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/msi' -Filter '*.msi' |
            ForEach-Object { Rename-Item -LiteralPath $_.FullName -NewName "Dexorium_${release}_x64.msi" }

      - name: Write Windows checksums
        shell: pwsh
        run: |
          $bundle = 'src-tauri/target/release/bundle'
          Get-ChildItem -LiteralPath $bundle -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.msi', '.msix' } |
            ForEach-Object {
              '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
            } |
            Set-Content -LiteralPath (Join-Path $bundle 'windows-SHA256SUMS.txt') -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msix/*.msix
            src-tauri/target/release/bundle/windows-SHA256SUMS.txt

  linux:
    name: Linux packages
    needs: [version, dataset]
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            wget

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/download-artifact@v4
        with:
          name: reference-db
          path: src-tauri/resources

      - run: npm ci

      - name: Build DEB and RPM packages
        run: |
          config="$RUNNER_TEMP/tauri-release.json"
          printf '{"version":"%s"}\n' '${{ needs.version.outputs.semver }}' > "$config"
          npx tauri build --bundles deb,rpm --config "$config"

      - name: Write Linux checksums
        run: |
          cd src-tauri/target/release/bundle
          find . -type f \( -name '*.deb' -o -name '*.rpm' \) -print0 |
            sort -z |
            xargs -0 sha256sum > linux-SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/linux-SHA256SUMS.txt

  release:
    name: Publish GitHub release
    needs: [version, dataset, windows, linux]
    if: needs.version.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Name the dataset asset after its checksum
        env:
          SEMVER: ${{ needs.version.outputs.semver }}
        run: mv release-assets/reference.db "release-assets/reference-${SEMVER}.db"

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mapfile -d '' assets < <(find release-assets -type f -print0)
          gh release create "$TAG" "${assets[@]}" \
            --target "$SHA" \
            --title "Dexorium $VERSION" \
            --generate-notes

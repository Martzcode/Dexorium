<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1e2a"/>
      <stop offset="1" stop-color="#0b0d13"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a65"/>
      <stop offset="0.45" stop-color="#f2543a"/>
      <stop offset="1" stop-color="#c22612"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232837"/>
      <stop offset="1" stop-color="#10131c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e8402a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e8402a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="452" fill="url(#glow)"/>

  <!-- Original Dexorium mark: a magnifier over an index list. -->
  <g>
    <path d="M 626 612 L 772 758" stroke="url(#accent)" stroke-width="86" stroke-linecap="round"/>
    <circle cx="462" cy="448" r="230" fill="url(#glass)" stroke="url(#accent)" stroke-width="58"/>
    <g stroke="#eef0f6" stroke-linecap="round" stroke-width="36">
      <path d="M 352 380 H 572" opacity="0.95"/>
      <path d="M 352 456 H 572" opacity="0.78"/>
      <path d="M 352 532 H 486" opacity="0.58"/>
    </g>
  </g>
</svg>

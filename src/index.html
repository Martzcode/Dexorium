<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Dexorium — Offline Pokémon Desktop Encyclopedia</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Dexorium is a fast, fully offline Pokémon desktop encyclopedia for players, collectors and competitive trainers. Built with Tauri, Rust, Angular and SQLite."
    />
    <meta name="theme-color" content="#0e1016" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <script src="theme-init.js"></script>
    <style>
      /* Paint the app background before the bundled stylesheet is parsed, so the
         window never flashes white while WebView2 boots. */
      html {
        background: #0e1016;
        color-scheme: dark;
      }
      html[data-theme='light'] {
        background: #f6f6fa;
        color-scheme: light;
      }
      body {
        margin: 0;
        background: inherit;
        color: #f4f5f8;
      }
      html[data-theme='light'] body {
        color: #15171f;
      }
    </style>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>

<div class="mx-auto max-w-6xl px-4 py-6">
  <h1 class="mb-4 text-2xl font-bold text-ink">{{ 'tools.sql.title' | transloco }}</h1>
  <textarea
    class="mb-3 h-32 w-full rounded-lg border border-line bg-panel p-3 font-mono text-sm text-ink"
    [value]="sql()"
    (input)="sql.set($any($event.target).value)"
  ></textarea>
  <button
    class="mb-4 rounded-lg bg-accent px-3 py-2 text-sm font-semibold text-white disabled:opacity-50"
    type="button"
    [disabled]="running()"
    (click)="run()"
  >
    {{ 'tools.sql.run' | transloco }}
  </button>
  @if (error()) {
    <p class="mb-3 text-sm text-red-500">{{ error() }}</p>
  }
  @if (columns().length > 0) {
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="text-ink-soft">
          <tr>
            @for (col of columns(); track col) {
              <th class="text-left">{{ col }}</th>
            }
          </tr>
        </thead>
        <tbody>
          @for (row of rows(); track $index) {
            <tr class="border-t border-line">
              @for (cell of row; track $index) {
                <td class="py-1 text-ink-soft">{{ cell }}</td>
              }
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
